[build]
  functions = "netlify/functions"

[functions]
  # The function only bundles its own directory by default — this pulls in the
  # actual FastAPI app package so `from app.main import app` resolves at runtime.
  # (Python version is pinned via backend/runtime.txt, per Netlify's docs —
  # functions.python_runtime here expects a different shape than a version
  # string, and a .python-version file is silently ignored by Netlify's build.)
  included_files = ["app/**"]

# FastAPI's routes live under /api/v1/*; Mangum's api_gateway_base_path (set in
# netlify/functions/api.py) strips the /.netlify/functions/api prefix back off,
# so what FastAPI sees matches its routes exactly, same as running under uvicorn.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/api/health"
  status = 200
