services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lht
      POSTGRES_PASSWORD: lht
      POSTGRES_DB: lht_store
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://lht:lht@db:5432/lht_store
      CORS_ORIGINS: '["http://localhost:5173"]'
      SECRET_KEY: change-me-in-production
    depends_on:
      - db
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  db_data:
